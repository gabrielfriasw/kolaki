name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: configurar o java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: configurar o gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: instalar a plataforma android
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: validar e compilar
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: guardar o apk de desenvolvimento
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kolaki-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: revisar dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: revisar dependências
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
