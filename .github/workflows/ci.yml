name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: configurar o java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: configurar o gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: instalar a plataforma android
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: validar e compilar
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: guardar o apk de desenvolvimento
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kolaki-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: revisar dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: revisar dependências
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
