name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: publicar apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.KOLAKI_KEYSTORE_BASE64 }}
      KOLAKI_KEYSTORE_PASSWORD: ${{ secrets.KOLAKI_KEYSTORE_PASSWORD }}
      KOLAKI_KEY_ALIAS: ${{ secrets.KOLAKI_KEY_ALIAS }}
      KOLAKI_KEY_PASSWORD: ${{ secrets.KOLAKI_KEY_PASSWORD }}
    steps:
      - name: baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: configurar o java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: configurar o gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: instalar a plataforma android
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"

      - name: preparar a versão e a assinatura
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$KOLAKI_KEYSTORE_PASSWORD"
          test -n "$KOLAKI_KEY_ALIAS"
          test -n "$KOLAKI_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kolaki-release.jks"
          echo "KOLAKI_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "KOLAKI_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "KOLAKI_KEYSTORE_PATH=$RUNNER_TEMP/kolaki-release.jks" >> "$GITHUB_ENV"

      - name: testar e compilar a versão
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: preparar os arquivos públicos
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk release/kolaki.apk
          sha256sum release/kolaki.apk > release/kolaki.apk.sha256

      - name: atestar a origem do apk
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release/kolaki.apk

      - name: publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/kolaki.apk \
            release/kolaki.apk.sha256 \
            --generate-notes \
            --title "KolaKi ${GITHUB_REF_NAME#v}" \
            --verify-tag
