name: Sugerir uma melhoria
description: Proponha uma melhoria para o aplicativo.
title: "[melhoria] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Explique qual dificuldade a sugestão resolve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva como a experiência deveria funcionar.
    validations:
      required: true
